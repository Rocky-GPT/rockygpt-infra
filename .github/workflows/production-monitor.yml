name: Production Monitor
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: production-monitor
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      UI_URL: ${{ secrets.UI_URL }}
      BRAIN_URL: ${{ secrets.BRAIN_URL }}
      DATA_URL: ${{ secrets.DATA_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: '22' }
      - name: Readiness, proxy, and invalid-request smoke with cold-start allowance
        run: node tests/service-smoke.mjs
      - name: Close recovered monitor incident
        if: success()
        continue-on-error: true
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          number="$(gh issue list --state open --label production-monitor --json number,title --jq '.[] | select(.title == "[Production Monitor] RockyGPT topology failing") | .number' | head -1)"
          if [ -n "$number" ]; then gh issue close "$number" --reason completed --comment "Recovered in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; fi
      - name: Open or update monitor incident
        if: failure()
        continue-on-error: true
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh label create production-monitor --color B60205 --description "Production topology monitor" --force
          title="[Production Monitor] RockyGPT topology failing"
          body="Production smoke failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          number="$(gh issue list --state open --label production-monitor --json number,title --jq '.[] | select(.title == "[Production Monitor] RockyGPT topology failing") | .number' | head -1)"
          if [ -n "$number" ]; then gh issue comment "$number" --body "$body"; else gh issue create --title "$title" --label production-monitor --body "$body"; fi
