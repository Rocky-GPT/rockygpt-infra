name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Environment sync safety and recovery
        run: python3 -m unittest discover -s tests -p test_environment_sync.py

      - name: Expiry watch
        run: python3 -m unittest discover -s tests -p test_check_expiries.py
